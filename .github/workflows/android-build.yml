name: Android build

# On demand only (Actions tab -> Android build -> Run workflow), so a private repository stays
# well inside GitHub's 2,000 free Actions minutes a month. Each build takes ~20-60 minutes.
on:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Unity licence secrets
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unity licence secrets are not set yet, so the APK build is skipped. See docs/BUILDING.md."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.licence.outputs.available == 'true'

      # The Unity Android image is large; make room on the runner.
      - name: Free disk space
        if: steps.licence.outputs.available == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/cache@v4
        if: steps.licence.outputs.available == 'true'
        with:
          path: unity/Library
          key: Library-Android-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt', 'core/package.json') }}
          restore-keys: Library-Android-

      - name: Build with Unity
        if: steps.licence.outputs.available == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: Android
          buildName: MonkeyPost
          buildMethod: MonkeyPost.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK
        if: steps.licence.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyPost-${{ github.run_number }}
          path: build/Android
          retention-days: 7
