name: Android build

# On demand only (Actions tab -> Android build -> Run workflow), so a private repository stays
# well inside GitHub's 2,000 free Actions minutes a month. A build takes about 5-10 minutes.
# Godot is free and open source: no licence, account or secrets are needed.
on:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Godot and the Android export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-download && cd ~/godot-download
          curl -fsSL -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q editor.zip -d ~/godot
          # Only the Android templates are needed; the full set is several GB unpacked.
          unzip -q templates.tpz 'templates/android_*' 'templates/version.txt' -d ~/godot-templates
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$(dirname "$dest")" && mv ~/godot-templates/templates "$dest"
          rm -f editor.zip templates.tpz
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      # A throwaway debug key, made fresh each run. Play Store uploads will use the company's
      # upload key instead (see docs/BUILDING.md).
      - name: Make a debug signing key
        run: |
          keytool -genkeypair -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Import the project
        working-directory: godot
        run: |
          dotnet build MonkeyPost.csproj
          "$GODOT" --headless --path . --import

      - name: Point Godot at the Android SDK and Java
        run: |
          settings=~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
          if [ ! -f "$settings" ]; then
            mkdir -p "$(dirname "$settings")"
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$settings"
          fi
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$settings"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$settings"

      - name: Export APK
        working-directory: godot
        run: |
          mkdir -p ../build
          "$GODOT" --headless --path . --export-debug "Android" ../build/MonkeyPost.apk 2>&1 | tee ../build/export.log
          test -s ../build/MonkeyPost.apk
          # Godot still writes an APK when the C# part fails, but it wouldn't run. Fail instead.
          if grep -E "ERROR: Export \.NET Project|ERROR: System\.|Project export for preset .* failed" ../build/export.log; then
            echo "::error::The C# part of the export failed; see the lines above."
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyPost-${{ github.run_number }}
          path: build/
          retention-days: 7
          if-no-files-found: ignore
